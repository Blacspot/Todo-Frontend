name: Cypress Regression Tests

on: push

jobs:
   cypress-run:
    runs-on: ubuntu-25.04
    steps:
       - name: Checkout
         uses: actions/checkout@v4

       - name: Setup pnpm
         uses: pnpm/action-setup@v4
         with:
          version: 10

       - name: Setup Node.js
         uses: actions/setup-node@v4
         with:
          node-version: '22.1.0'
          cache: 'pnpm'

       - name: cypress run
         uses: cypress-io/github-action@v6
         with:
          build: pnpm build
          start: pnpm start
          browser: chrome
          
   
      
        